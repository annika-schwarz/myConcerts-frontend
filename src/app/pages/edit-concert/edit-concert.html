<div class="container py-4">
  <h2 class="fw-bold mb-4">Konzert bearbeiten</h2>

  @if (concertToEdit()){
  <!-- [initialData] schickt das Konzert via Signal ins Formular -->
  <!-- (submitForm) fängt die aktualisierten Daten ab -->
  <app-concert-form 
    [initialData]="concertToEdit()" 
    (submitForm)="onUpdate($event)" 
  />
  } @else {
    <div class="alert alert-info">
      Konzertdaten werden geladen ...
    </div>
  }
</div>
